<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <base href="/omni-ai-trading/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#131209" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
  <script>try{var t=localStorage.getItem("omni-report-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <title>페이지를 찾을 수 없습니다 — Omni AI Trading</title>
  <meta name="robots" content="noindex">
  <style>:root{--bg:#fff;--text:#1a1c20;--muted:#555d6d;--accent:#f60;--accent-text:#b93901;--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light}@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#131209;--text:#f3f4f5;--muted:#b0b3ba;--accent-text:#ff9364;--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}}:root[data-theme=dark]{--bg:#131209;--text:#f3f4f5;--muted:#b0b3ba;--accent-text:#ff9364;--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}body{background:var(--bg);min-height:100vh;color:var(--text);word-break:keep-all;place-items:center;margin:0;font-family:Pretendard Variable,Pretendard,system-ui,sans-serif;display:grid}main{text-align:center;justify-items:center;gap:16px;padding:32px 16px;display:grid}h1{margin:0;font-size:1.875rem;font-weight:600;line-height:2.25rem}p{color:var(--muted);margin:0;font-size:1rem;line-height:1.5rem}a{background:var(--accent);color:#131209;border-radius:8px;padding:8px 12px;font-weight:600;text-decoration:none;display:inline-flex}a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}img{width:200px;height:auto}</style>
</head>
<body>
  <main>
    <img src="./img/mascot-wave.webp" alt="" width="200" height="200">
    <h1>찾는 페이지가 없습니다</h1>
    <p>주소가 바뀌었거나 지워졌을 수 있습니다. 리포트를 찾는다면 보관함에서 날짜로 찾아보세요.</p>
    <a href="./">처음으로 돌아가기</a>
    <a href="./reports/" style="background:transparent;color:var(--accent-text)">리포트 보관함</a>
  </main>
</body>
</html>
