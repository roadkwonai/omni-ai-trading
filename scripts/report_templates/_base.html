<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}{{ title }}{% endblock %} · Omni AI Trading 리포트</title>
<meta name="description" content="{{ description|truncate(150, True, '…') }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description|truncate(150, True, '…') }}">
{% if url %}<meta property="og:url" content="{{ url }}">{% endif %}
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171b" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="{{ root }}assets/favicon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="{{ root }}assets/report.css?v={{ css_version }}">
<script src="{{ root }}assets/theme.js?v={{ css_version }}"></script>
</head>
<body>
<a class="skip skip-link" href="#main">본문으로 건너뛰기 (Skip to content)</a>
<header class="topbar">
  <div class="wrap">
    <a class="brandmark" href="{{ root }}index.html"><img src="{{ root }}assets/logo.png" alt="" width="28" height="28">Omni AI Trading</a>
    <nav aria-label="리포트 메뉴">
      <a href="{{ root }}reports/index.html">전체 리포트</a>
    </nav>
    <div class="tools">
      <button type="button" class="theme-toggle" aria-label="화면 테마 시스템, 눌러서 바꾸기">
        <svg data-icon="system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <svg data-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg data-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <span class="theme-name">시스템</span>
      </button>
    </div>
  </div>
</header>
{% block body %}{% endblock %}
<footer class="footer">
  <div class="wrap"><p>자동 생성 {{ generated_at }} · 모의·가상 결과가 섞여 있으며 투자 권유가 아닙니다 · 과거 결과는 앞날을 보장하지 않습니다.</p></div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
