{% extends "_base.html" %}
{% block title %}전체 리포트{% endblock %}
{% block body %}
<section class="hero">
  <div class="wrap hero-split">
    <div>
      <span class="kicker">리포트 보관함</span>
      <h1>전체 리포트</h1>
      <p class="lede">매매일지, 장전 분석, 장 마감 개선안, 장기투자 전략 리포트를 날짜와 종류로 찾습니다.</p>
    </div>
    <img class="mascot" src="{{ root }}assets/mascot.png" alt="" width="180" height="180">
  </div>
</section>
<main id="main" class="wrap" style="padding:32px 0 56px">
  <form class="filters" role="search" onsubmit="return false">
    <label class="field">검색어<input id="q" type="search" placeholder="제목·요약·본문" autocomplete="off"></label>
    <label class="field">종류<select id="kind"><option value="">모든 종류</option>{% for k in kinds %}<option value="{{ k.key }}">{{ k.name }}</option>{% endfor %}</select></label>
    <label class="field">연도<select id="year"><option value="">전체</option></select></label>
    <label class="field">월<select id="month"><option value="">전체</option></select></label>
    <label class="field">날짜<input id="day" type="date"></label>
  </form>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="list"></div>
  <noscript><ul class="list">{% for r in reports %}<li class="item"><a href="{{ r.path }}"><strong>{{ r.title }}</strong></a></li>{% endfor %}</ul></noscript>
</main>
{% endblock %}
{% block scripts %}<script src="{{ root }}assets/index.js?v={{ css_version }}"></script>{% endblock %}
